title: "Wenran Liu (刘文然)"
description: >-
  Research Engineer at Shanghai AI Laboratory. I work on LLM post-training,
  AI agents, and generative visual models.
url: "https://liuwenran.github.io"
repository: "liuwenran/liuwenran.github.io"
timezone: Asia/Shanghai
encoding: utf-8

author:
  name: "Wenran Liu (刘文然)"
  avatar: "/images/profile.jpg"
  bio: "Shanghai AI Laboratory"
  location: "Shanghai, China"
  email: "lwrshi1965@gmail.com"
  github: "liuwenran"
  googlescholar: "https://scholar.google.com/citations?user=fwKOaD8AAAAJ&hl=en"

include:
  - _pages

exclude:
  - docs
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - temp

markdown: kramdown
highlighter: rouge
permalink: /:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
